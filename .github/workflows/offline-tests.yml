name: Offline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal test tools
        run: python -m pip install -r requirements-phase0.lock.txt
      - name: Run without corpus or model downloads
        run: python -m pytest -q tests/test_phase0.py tests/test_benchmark_phase2.py tests/test_retrieval_phase3.py tests/test_annotation_review_phase3b.py
